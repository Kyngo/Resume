name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended

      - name: Install fonts
        run: |
          wget -q https://assets.ubuntu.com/v1/0cef8205-ubuntu-font-family-0.83.zip -O fonts.zip
          unzip -q fonts.zip
          mkdir -p fonts
          cp ubuntu-font-family*/*.ttf fonts/

      - name: Build the project
        run: |
          xelatex -interaction=nonstopmode Resume.tex
          xelatex -interaction=nonstopmode Resume.tex
          mkdir -p artifacts
          mv Resume.pdf artifacts

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_DATE=$(date '+%Y%m%d%H%M%S')
          gh release create "$CURRENT_DATE"
          gh release upload "$CURRENT_DATE" "artifacts/Resume.pdf"
